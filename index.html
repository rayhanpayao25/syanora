<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Kampot Hotel & Residence</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Maps -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "@google/genai": "https://esm.sh/@google/genai@0.1.1",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
    
    <!-- Custom Scrollbar Styles -->
    <style>

        
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;

            
        }
    </style>

    <!-- Start of own-65015 Zendesk Widget script -->
    <script 
        id="ze-snippet" 
        src="https://static.zdassets.com/ekr/snippet.js?key=5bd7c3ce-556c-4318-b8b0-2e773bf66fed" 
        async 
        defer   
    ></script>
    <!-- End of own-65015 Zendesk Widget script -->

    <script>
        // Pre-configure Zendesk behavior
        window.zESettings = {
            webWidget: {
                offset: { horizontal: '20px', vertical: '20px' }
            }
        };

        // Instantly hide default Zendesk launcher on boot so custom React chatbot shows
        const hideNativeZendesk = () => {
            if (typeof window.zE === 'function') {
                try { window.zE('messenger', 'hide'); } catch(e) {}
                try { window.zE('webWidget', 'hide'); } catch(e) {}
            }
        };

        // Run hide on ready events
        document.addEventListener('DOMContentLoaded', hideNativeZendesk);
        document.addEventListener('ze:ready', hideNativeZendesk);
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
